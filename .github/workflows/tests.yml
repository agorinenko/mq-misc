name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            name: Python 3.10
          - python-version: '3.11'
            name: Python 3.11
          - python-version: '3.12'
            name: Python 3.12
          - python-version: '3.13'
            name: Python 3.13
          - python-version: '3.14'
            name: Python 3.14
          - python-version: '3.14'
            aio-pika: '9.6.2'
            name: Python 3.14 / aio-pika 9.6.2
    services:
      rabbitmq:
        image: rabbitmq:4
        env:
          RABBITMQ_DEFAULT_USER: mq_misc
          RABBITMQ_DEFAULT_PASS: mq_misc
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MQ_MISC_TEST_AMQP_URL: amqp://mq_misc:mq_misc@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Pin aio-pika
        if: matrix.aio-pika
        run: python -m pip install "aio-pika==${{ matrix.aio-pika }}"
      - name: Run tests
        run: python -m pytest -q
